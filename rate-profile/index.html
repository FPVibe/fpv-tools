<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPV Rate Profile Comparison Tool</title>
    <link rel="stylesheet" href="../assets/site-header.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <fpv-header root="../" icon="📈" heading="FPV Rate Profile Comparison Tool" subtitle="Compare and analyze Betaflight rate profiles side-by-side"></fpv-header>
    <script type="module" src="../assets/site-header.js"></script>

    <div class="container">
        <!-- Main Comparison Area -->
        <div class="comparison-section">
            <!-- Graph Controls -->
            <div class="graph-controls">
                <div class="control-group">
                    <h3>Visibility Controls</h3>
                    <div class="toggle-group" id="profile-visibility-toggles">
                        <!-- Dynamically populated by app.js -->
                    </div>
                    <div class="toggle-group">
                        <label>
                            <input type="checkbox" id="toggle-roll" checked>
                            <span class="color-indicator roll"></span> Roll
                        </label>
                        <label>
                            <input type="checkbox" id="toggle-pitch" checked>
                            <span class="color-indicator pitch"></span> Pitch
                        </label>
                        <label>
                            <input type="checkbox" id="toggle-yaw" checked>
                            <span class="color-indicator yaw"></span> Yaw
                        </label>
                    </div>
                </div>
                <div class="control-group view-mode-control" id="view-mode-control" style="display: none;">
                    <h3>Display Mode</h3>
                    <div class="toggle-group">
                        <label>
                            <input type="radio" name="view-mode" id="view-mode-overlay" value="overlay" checked>
                            Overlay (Combined)
                        </label>
                        <label>
                            <input type="radio" name="view-mode" id="view-mode-sidebyside" value="sidebyside">
                            Side-by-Side
                        </label>
                    </div>
                </div>
            </div>

            <!-- Graphs - Overlay Mode -->
            <div class="graphs-container" id="graphs-overlay">
                <div class="graph-panel" data-collapse-key="overlay-rate">
                    <h2 class="graph-panel-heading">
                        <button type="button" class="graph-panel-header" aria-expanded="true">
                            <span>Rate Curves</span>
                            <span class="graph-panel-chevron" aria-hidden="true">▾</span>
                        </button>
                    </h2>
                    <div class="graph-panel-body">
                        <canvas id="rate-canvas" width="900" height="500"></canvas>
                        <div class="graph-legend">
                            <span class="legend-item"><span class="line-solid roll"></span> Roll</span>
                            <span class="legend-item"><span class="line-solid pitch"></span> Pitch</span>
                            <span class="legend-item"><span class="line-solid yaw"></span> Yaw</span>
                            <span class="separator">|</span>
                            <span id="rate-graph-profile-legend"></span>
                        </div>
                    </div>
                </div>

                <div class="graph-panel" data-collapse-key="overlay-throttle">
                    <h2 class="graph-panel-heading">
                        <button type="button" class="graph-panel-header" aria-expanded="true">
                            <span>Throttle Curves</span>
                            <span class="graph-panel-chevron" aria-hidden="true">▾</span>
                        </button>
                    </h2>
                    <div class="graph-panel-body">
                        <canvas id="throttle-canvas" width="900" height="500"></canvas>
                        <div class="graph-legend">
                            <span id="throttle-graph-profile-legend"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Graphs - Side-by-Side Mode (populated dynamically by app.js) -->
            <div class="graphs-container-sidebyside" id="graphs-sidebyside" style="display: none;"></div>
        </div>

        <!-- Profile Editors (populated dynamically by app.js) -->
        <div class="editors-section" id="editors-section"></div>

        <!-- History Section -->
        <div class="history-section">
            <div class="history-header">
                <h2>Profile History</h2>
                <div class="history-actions">
                    <button id="export-history-btn" class="btn btn-secondary">Export History</button>
                    <button id="import-history-btn" class="btn btn-secondary">Import History</button>
                    <button id="clear-history-btn" class="btn btn-danger">Clear All</button>
                </div>
            </div>
            <div class="history-timeline">
                <div id="history-list" class="history-list">
                    <!-- History items will be dynamically added here -->
                </div>
            </div>
            <input type="file" id="history-file-input" accept=".json" style="display: none;">
        </div>
    </div>

    <script type="module" src="src/app.js"></script>
</body>
</html>
